<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting TikTok</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./">GTA Vice Hours Uploader</a>
<nav><a href="studio.html">TikTok studio</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a></nav></header>
<main>
<h1>Connecting TikTok</h1>
<p id="msg" class="muted">Finishing sign-in…</p>
</main>
<script>
(async () => {
  const q = new URLSearchParams(location.search), msg = document.getElementById("msg");
  if (q.get("error")) { msg.textContent = "TikTok sign-in was cancelled or failed: " + (q.get("error_description") || q.get("error")); return; }
  try {
    const r = await fetch("http://127.0.0.1:8765/api/callback", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: q.get("code"), state: q.get("state")})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    history.replaceState(null, "", location.pathname);       // the code is single-use; keep it out of history
    msg.textContent = "Connected as " + (j.display_name || "your TikTok account") + ". Opening the studio…";
    setTimeout(() => location.href = "studio.html", 1200);
  } catch (e) { msg.textContent = "Could not finish sign-in: " + e.message + ". Is the GTA Vice Hours tool running?"; }
})();
</script>
</body></html>
